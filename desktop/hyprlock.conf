input-field {
    monitor =
    size = 512, 48
    zindex = 1 # above the panel shapes
    outline_thickness = 2
    rounding = 0
    outer_color = $accent
    inner_color = $surface_base
    font_color = $text_primary
    font_family = BlexMono Nerd Font
    check_color = $accent
    fail_color = $error
    capslock_color = $warning
    dots_size = 0.17
    dots_spacing = 0.5
    dots_rounding = 0
    dots_center = false
    fade_on_empty = false
    placeholder_text = <span foreground='{{text-muted}}'>password</span>
    fail_text = AUTH FAILED ($ATTEMPTS)
    position = 0, 36
    halign = center
    valign = center
}

label { # hint
    monitor =
    text = Enter: unlock    Esc: clear
    zindex = 1 # above the panel shapes
    color = $text_muted
    font_size = 16
    font_family = BlexMono Nerd Font
    position = 0, -22
    halign = center
    valign = center
