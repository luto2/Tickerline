label { # host / uptime
    monitor =
    text = cmd[update:60000] echo "$(cat /etc/hostname) · $(uptime -p)"
    color = $text_muted
    font_size = 14
    font_family = BlexMono Nerd Font
    position = 64, -1016
    halign = left
    valign = top
}

label { # now playing. No double braces here: hyprlang reads them as math and drops the value ('Sample Text'). No player: no-break space
    monitor =
    text = cmd[update:5000] playerctl metadata title >/dev/null 2>&1 && echo "$(playerctl metadata artist) — $(playerctl metadata title)" || printf '\302\240'
    color = $text_muted
    font_size = 14
    font_family = BlexMono Nerd Font
    position = -112, -1016
    halign = right
    valign = top
}

label { # switch user: GDM opens a new login screen, this session stays locked
    monitor =
    text = 
    color = $accent
    font_size = 18
    font_family = Symbols Nerd Font Mono
    onclick = gdbus call --system --dest org.gnome.DisplayManager --object-path /org/gnome/DisplayManager/LocalDisplayFactory --method org.gnome.DisplayManager.LocalDisplayFactory.CreateTransientDisplay
    position = -64, -1018 # ink center level with the uptime text (measured on screen)
    halign = right
    valign = top
}
