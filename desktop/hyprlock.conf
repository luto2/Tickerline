# Tickerline lock screen (spec: Desktop §7). Installed by apply-palette.py.

# Colors come from hyprlock/colors.conf ($accent, $text_muted, ...). '##' is a literal '#'.

source = ~/.config/hypr/hyprlock/colors.conf



general {
    hide_cursor = false # the switch-user icon needs the mouse
}



background {
    monitor =
    path = ~/.local/share/backgrounds/tickerline.png
    color = $surface_base
    blur_passes = 0
}



shape { # cyan square
    monitor =
    size = 12, 12
    color = $accent
    rounding = 0
    position = 64, -59 # center level with the BOOT//TERMINAL caps (measured on screen)
    halign = left
    valign = top
}

label { # wordmark
    monitor =
    text = BOOT//TERMINAL
    color = $accent
    font_size = 22
    font_family = Chakra Petch SemiBold
    position = 92, -46
    halign = left
    valign = top
}

label { # status
    monitor =
    text = cmd[update:30000] echo "SESSION LOCKED · $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)% · <span foreground='{{success}}'>READY</span>"
    color = $text_muted
    font_size = 14
    font_family = BlexMono Nerd Font
    position = -64, -50
    halign = right
    valign = top
}

shape { # top hairline
    monitor =
    size = 1920, 1
    color = $divider
    rounding = 0
    position = 0, -96
    halign = left
    valign = top
}

label { # clock
    monitor =
    text = $TIME
    color = $text_primary
    font_size = 96
    font_family = Chakra Petch Medium
    position = 0, 304
    halign = center
    valign = center
}

label { # date
    monitor =
    text = cmd[update:60000] date +'%A %d %B %Y' | tr a-z A-Z
    color = $text_muted
    font_size = 13
    font_family = BlexMono Nerd Font Medium
    position = 0, 222
    halign = center
    valign = center
}

shape { # panel: surface-low at 0.92
    monitor =
    size = 560, 200
    color = rgba(0D1B2FEB)
    rounding = 0
    border_size = 1
    border_color = $divider
    position = 680, -400
    halign = left
    valign = top
}

shape { # panel header (GRUB panel-header)
    monitor =
    size = 558, 55
    color = rgba(0E1E34FF)
    rounding = 0
    position = 681, -401
    halign = left
    valign = top
}

