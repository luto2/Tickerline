insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
set gfxmode=1920x1080
terminal_output gfxterm
loadfont $prefix/themes/boot-terminal/plexmono-regular-16.pf2
loadfont $prefix/themes/boot-terminal/plexmono-regular-22.pf2
loadfont $prefix/themes/boot-terminal/plexmono-semibold-22.pf2
set theme=$prefix/themes/boot-terminal/theme.txt
export theme
set timeout=-1
menuentry 'Arch Linux' --class arch --class gnu-linux --class gnu --class os { true }
submenu 'Advanced options for Arch Linux' {
  menuentry 'Arch Linux, with Linux linux' --class arch --class gnu-linux --class gnu --class os { true }
  menuentry 'Arch Linux, with Linux linux (fallback initramfs)' --class arch --class gnu-linux --class gnu --class os { true }
}
menuentry "Windows 11" --class windows --class os { true }
